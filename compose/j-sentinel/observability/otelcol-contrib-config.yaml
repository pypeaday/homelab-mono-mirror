receivers:
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
  windowseventlog/application:
    channel: application
    start_at: end
    poll_interval: 10s
  windowseventlog/system:
    channel: system
    start_at: end
    poll_interval: 10s
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    send_batch_max_size: 1500
    timeout: 10s
  resourcedetection:
    detectors: [system]
    timeout: 2s
  resource:
    attributes:
      - key: host.name
        value: j-sentinel
        action: upsert
      - key: os.type
        value: windows
        action: upsert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: C:\ProgramData\otelcol-contrib\queue
    timeout: 10s

exporters:
  otlp:
    endpoint: "100.64.184.5:4317"
    tls:
      insecure: true
    sending_queue:
      queue_size: 5000
      storage: file_storage
    retry_on_failure:
      enabled: true

service:
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions:
    - health_check
    - file_storage
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [resourcedetection, resource, batch]
      exporters: [otlp]
    logs:
      receivers: [otlp, windowseventlog/application, windowseventlog/system]
      processors: [resourcedetection, resource, batch]
      exporters: [otlp]
