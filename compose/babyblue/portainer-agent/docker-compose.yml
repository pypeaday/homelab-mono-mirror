services:
  portainer-agent:
    image: portainer/agent:2.20.3
    container_name: portainer_agent
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
