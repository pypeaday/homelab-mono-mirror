services:
  actual_server:
    container_name: actual
    image: docker.io/actualbudget/actual-server:26.10.0
    ports:
      # This line makes Actual available at port 5006 of the device you run the server on,
      # i.e. http://localhost:5006. You can change the first number to change the port, if you want.
      - "5006:5006"
    # environment:
    # Uncomment any of the lines below to set configuration options.
    # - ACTUAL_HTTPS_KEY=/data/selfhost.key
    # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
    # - ACTUAL_PORT=5006
    # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
    # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
    # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
    # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
    # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - /tank/encrypted/docker/actual/actual-data:/data
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - phantomlink
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual.rule: "Host(`actual.paynepride.com`)"
      traefik.http.routers.actual.tls.certresolver: letsencrypt
      traefik.http.routers.actual.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.actual.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.actual.loadbalancer.server.port: "5006"
      traefik.http.routers.actual.middlewares: "default-whitelist@file"

  # Drop-folder importer: drop bank exports into
  # /tank/encrypted/docker/actual/import-drop/<account-slug>/ and they get
  # converted + imported via the actual CLI. See README.md.
  actual_import:
    container_name: actual-import
    build: ./importer
    restart: unless-stopped
    # CLI loads the full budget into memory per call — 256m OOM-killed it
    mem_limit: 640m
    memswap_limit: 640m
    networks:
      - phantomlink
    environment:
      ACTUAL_SERVER_URL: http://actual:5006
      ACTUAL_SYNC_ID: 8f042e31-dfe2-40bb-b612-9a1842b67c4a
      # set in the Komodo stack's Environment (periphery can't see /tank paths)
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD}
      ACTUAL_DATA_DIR: /cache
      IMPORT_DIR: /import
      IMPORT_SWEEP_SEC: "60"
    volumes:
      - /tank/encrypted/docker/actual/import-drop:/import
      - ./importer/accounts.json:/etc/actual-import/accounts.json:ro
      - actual-cli-data:/cache

  # Read-only dashboard: aggregates via the API every REFRESH_MIN and serves
  # a static chart page at https://budget.paynepride.com (whitelist-gated).
  actual_dash:
    container_name: actual-dash
    build: ./importer
    command: ["node", "/dash/dashboard.mjs"]
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 640m
    networks:
      - phantomlink
    environment:
      ACTUAL_SERVER_URL: http://actual:5006
      ACTUAL_SYNC_ID: 8f042e31-dfe2-40bb-b612-9a1842b67c4a
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD}
      REFRESH_MIN: "30"
    volumes:
      - ./dashboard:/dash:ro
      - actual-dash-data:/cache
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual-dash.rule: "Host(`budget.paynepride.com`)"
      traefik.http.routers.actual-dash.tls.certresolver: letsencrypt
      traefik.http.routers.actual-dash.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.actual-dash.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.actual-dash.loadbalancer.server.port: "3000"
      traefik.http.routers.actual-dash.middlewares: "default-whitelist@file"

networks:
  phantomlink:
    external: true

volumes:
  actual-cli-data:
  actual-dash-data:
