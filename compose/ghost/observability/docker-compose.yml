x-clickhouse-defaults: &clickhouse-defaults
  restart: unless-stopped
  image: clickhouse/clickhouse-server:24.1.2-alpine
  tty: true
  depends_on:
    - zookeeper-1
  logging:
    options:
      max-size: 50m
      max-file: "3"
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  deploy:
    resources:
      limits:
        memory: "6g"

x-db-depend: &db-depend
  depends_on:
    clickhouse:
      condition: service_healthy
    otel-collector-migrator-sync:
      condition: service_completed_successfully

services:

  zookeeper-1:
    image: bitnamilegacy/zookeeper:3.7.1
    container_name: signoz-zookeeper-1
    hostname: zookeeper-1
    user: root
    volumes:
      - /tank/encrypted/docker/signoz-zfs/zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
    restart: unless-stopped
    networks:
      - phantomlink

  clickhouse:
    <<: *clickhouse-defaults
    container_name: signoz-clickhouse
    hostname: clickhouse
    volumes:
      - /tank/encrypted/docker/signoz-zfs/config/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - /tank/encrypted/docker/signoz-zfs/config/clickhouse-users.xml:/etc/clickhouse-server/users.xml
      - /tank/encrypted/docker/signoz-zfs/config/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - /tank/encrypted/docker/signoz-zfs/config/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - /tank/encrypted/docker/signoz-zfs/clickhouse:/var/lib/clickhouse
      - /tank/encrypted/docker/signoz-zfs/config/user_scripts:/var/lib/clickhouse/user_scripts/
    networks:
      - phantomlink

  alertmanager:
    image: signoz/alertmanager:${ALERTMANAGER_TAG:-0.23.7}
    container_name: signoz-alertmanager
    volumes:
      - /tank/encrypted/docker/signoz-zfs/alertmanager:/data
    depends_on:
      query-service:
        condition: service_healthy
    restart: unless-stopped
    command:
      - --queryService.url=http://query-service:8085
      - --storage.path=/data
    networks:
      - phantomlink

  query-service:
    image: signoz/query-service:${DOCKER_TAG:-0.64.0}
    container_name: signoz-query-service
    command:
      [
        "-config=/root/config/prometheus.yml",
        "--use-logs-new-schema=true",
        "--use-trace-new-schema=true"
      ]
    volumes:
      - /tank/encrypted/docker/signoz-zfs/config/prometheus.yml:/root/config/prometheus.yml
      - /tank/encrypted/docker/signoz-zfs/signoz:/var/lib/signoz/
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - ALERTMANAGER_API_PREFIX=http://alertmanager:9093/api/
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *db-depend
    networks:
      - phantomlink

  frontend:
    image: signoz/frontend:${DOCKER_TAG:-0.64.0}
    container_name: signoz-frontend
    restart: unless-stopped
    depends_on:
      - alertmanager
      - query-service
    ports:
      - "3301:3301"
    volumes:
      - /tank/encrypted/docker/signoz-zfs/config/nginx-config.conf:/etc/nginx/conf.d/default.conf
    networks:
      - phantomlink
    labels:
      traefik.enable: "true"
      traefik.http.routers.signoz.rule: Host(`signoz.paynepride.com`)
      traefik.http.routers.signoz.tls.certresolver: letsencrypt
      traefik.http.routers.signoz.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.signoz.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.signoz.loadbalancer.server.port: "3301"
      traefik.http.routers.signoz.middlewares: default-whitelist@file

  otel-collector-migrator-sync:
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-0.111.16}
    container_name: otel-migrator-sync
    command: ["sync", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - phantomlink

  otel-collector-migrator-async:
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-0.111.16}
    container_name: otel-migrator-async
    command: ["async", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
    networks:
      - phantomlink

  otel-collector:
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-0.111.16}
    container_name: signoz-otel-collector
    command:
      [
        "--config=/etc/otel-collector-config.yaml",
        "--manager-config=/etc/manager-config.yaml",
        "--copy-path=/var/tmp/collector-config.yaml",
        "--feature-gates=-pkg.translator.prometheus.NormalizeName"
      ]
    user: root # required for reading docker container logs + stats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /tank/encrypted/docker/signoz-zfs/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /tank/encrypted/docker/signoz-zfs/config/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=ghost,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      # OTLP gRPC — bound to localhost + LAN + tailscale only
      - "127.0.0.1:4317:4317"
      - "192.168.1.9:4317:4317"
      - "100.64.184.5:4317:4317"
      # OTLP HTTP
      - "127.0.0.1:4318:4318"
      - "192.168.1.9:4318:4318"
      - "100.64.184.5:4318:4318"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "2g"
    labels:
      # Public OTLP ingest for off-network senders (Cloudflare Workers' OTel
      # export). SigNoz self-hosted has no ingest auth — OTEL_INGEST_PATH is a
      # capability path (set it in .env, e.g. openssl rand -hex 16).
      traefik.enable: "true"
      traefik.http.routers.otel-ingest.rule: Host(`otel.paynepride.com`) && PathPrefix(`${OTEL_INGEST_PATH:?set OTEL_INGEST_PATH in .env — a secret path for OTLP ingest}`)
      traefik.http.routers.otel-ingest.tls.certresolver: letsencrypt
      traefik.http.routers.otel-ingest.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.otel-ingest.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.routers.otel-ingest.middlewares: "otel-ingest-strip"
      traefik.http.middlewares.otel-ingest-strip.stripPrefix.prefixes: "${OTEL_INGEST_PATH:?set OTEL_INGEST_PATH in .env}"
      traefik.http.services.otel-ingest.loadbalancer.server.port: "4318"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    networks:
      - phantomlink

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: signoz-node-exporter
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.sysfs=/host/sys
      - --path.procfs=/host/proc
      - --collector.zfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker|run)($|/)
      - --collector.textfile.directory=/textfiles
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /tank/encrypted/docker/signoz-zfs/textfiles:/textfiles:ro
    ports:
      - "9100:9100"
    networks:
      - phantomlink

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: signoz-smartctl-exporter
    restart: unless-stopped
    privileged: true
    user: "0"
    command:
      - --smartctl.path=/usr/sbin/smartctl
      - --smartctl.interval=60s
    volumes:
      - /dev:/dev:ro
    ports:
      - "9633:9633"
    networks:
      - phantomlink

  gotify-bridge:
    image: ghcr.io/druggeri/alertmanager_gotify_bridge:2.3.2
    container_name: signoz-gotify-bridge
    environment:
      - GOTIFY_TOKEN=${GOTIFY_TOKEN}
      - GOTIFY_ENDPOINT=http://gotify:80/message
      - ALERTS_PRIORITY=5
    restart: unless-stopped
    networks:
      - phantomlink

  logspout:
    image: "gliderlabs/logspout:v3.2.14"
    container_name: signoz-logspout
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: syslog+tcp://otel-collector:2255
    environment:
      - TAIL=0
    depends_on:
      - otel-collector
    restart: unless-stopped
    networks:
      - phantomlink

networks:
  phantomlink:
    external: true
