services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.paynepride.com
    volumes:
      # config lives in-repo next to this file — edit + commit + restart to change the board
      - ./config:/app/config
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - phantomlink
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: "Host(`home.paynepride.com`)"
      traefik.http.routers.homepage.entrypoints: "websecure"
      traefik.http.routers.homepage.tls.certresolver: letsencrypt
      traefik.http.routers.homepage.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.homepage.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.homepage.loadbalancer.server.port: "3000"
networks:
  phantomlink:
    external: true
