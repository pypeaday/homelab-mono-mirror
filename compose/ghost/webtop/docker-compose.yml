services:
  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: webtop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - TITLE=Dad's Desktop
    volumes:
      - /tank/encrypted/docker/webtop/config:/config
    shm_size: "2gb"
    networks:
      - phantomlink
    deploy:
      resources:
        limits:
          memory: 10g
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.webtop.rule: "Host(`dad.paynepride.com`)"
      traefik.http.routers.webtop.entrypoints: "websecure"
      traefik.http.routers.webtop.tls.certresolver: "letsencrypt"
      traefik.http.routers.webtop.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.webtop.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.webtop.loadbalancer.server.port: "3000"
      traefik.http.routers.webtop.middlewares: "simple-auth@file,default-headers@file"

networks:
  phantomlink:
    external: true
