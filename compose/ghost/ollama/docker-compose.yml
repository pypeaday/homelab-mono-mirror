services:
  ollama:
    image: ollama/ollama:0.40.2
    container_name: ollama
    restart: unless-stopped
    mem_limit: 16g
    networks:
      - phantomlink
    volumes:
      - /tank/encrypted/docker/ollama:/root/.ollama
    environment:
      # alerts are rare — keep the model loaded so cold-start never eats a verdict
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"

networks:
  phantomlink:
    external: true
