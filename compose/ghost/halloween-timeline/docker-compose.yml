services:
  web:
    image: git.paynepride.com/nic/halloween-timeline:latest
    container_name: halloween-timeline
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      - phantomlink
    labels:
      traefik.enable: "true"
      traefik.http.routers.halloween.entrypoints: "websecure"
      traefik.http.routers.halloween.rule: "Host(`halloween.paynepride.com`)"
      traefik.http.routers.halloween.tls.certresolver: letsencrypt
      traefik.http.routers.halloween.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.halloween.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.halloween.loadbalancer.server.port: "80"

networks:
  phantomlink:
    external: true
