services:
  api:
    image: git.paynepride.com/nic/names-api:latest
    # build: https://git.paynepride.com/nic/names-api.git#main:api
    container_name: names-api
    env_file: .env          # DATABASE_URL=postgres://names:PASS@db:5432/names
    networks:
      - default
      - phantomlink
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      traefik.enable: "true"
      traefik.http.routers.names-api.entrypoints: "websecure"
      traefik.http.routers.names-api.rule: "Host(`names.paynepride.com`)"
      traefik.http.routers.names-api.tls.certresolver: letsencrypt
      traefik.http.routers.names-api.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.names-api.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.names-api.loadbalancer.server.port: "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: names-api-db
    env_file: .env          # POSTGRES_DB/USER/PASSWORD
    volumes:
      - /tank/encrypted/docker/names-api/postgres:/var/lib/postgresql/data
    networks:
      - default             # not on phantomlink — unreachable from traefik
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  phantomlink:
    external: true
