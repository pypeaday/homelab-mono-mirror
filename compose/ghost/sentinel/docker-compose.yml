services:
  web:
    image: git.paynepride.com/nic/jb-sleuth:latest
    container_name: sentinel
    networks:
      - phantomlink
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      traefik.enable: "true"
      traefik.http.routers.sentinel.entrypoints: "websecure"
      traefik.http.routers.sentinel.rule: "Host(`sentinel-j.paynepride.com`)"
      traefik.http.routers.sentinel.tls.certresolver: letsencrypt
      traefik.http.routers.sentinel.tls.domains[0].main: "paynepride.com"
      traefik.http.routers.sentinel.tls.domains[0].sans: "*.paynepride.com"
      traefik.http.services.sentinel.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  phantomlink:
    external: true
