image:
  repository: gristlabs/grist
  tag: latest

containerPort: 8484

env:
  - name: TZ
    value: "America/Chicago"
  - name: PUID
    value: "1000"
  - name: PGID
    value: "1000"

volumes:
  - name: data
    mountPath: /persist
    hostPath: /tank/encrypted/docker/the-pit-zfs/grist

ingress:
  host: grist.paynepride.com

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "1Gi"
