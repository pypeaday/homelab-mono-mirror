image:
  repository: eigenfocus/eigenfocus
  tag: 1.0.0-free

containerPort: 3000

env:
  - name: PUID
    value: "1000"
  - name: PGID
    value: "1000"
  - name: TZ
    value: "America/Chicago"

envFrom:
  - secretRef:
      name: eigenfocus-secrets

volumes:
  - name: data
    mountPath: /eigenfocus-app/app-data
    hostPath: /tank/encrypted/docker/eigenfocus/app-data

ingress:
  host: eigenfocus.paynepride.com
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-ip-whitelist@kubernetescrd

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"

sealedSecret:
  enabled: true
  name: eigenfocus-secrets
