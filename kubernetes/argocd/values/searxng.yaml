image:
  repository: docker.io/searxng/searxng
  tag: latest

containerPort: 8080

env:
- name: UWSGI_WORKERS
  value: "4"
- name: UWSGI_THREADS
  value: "4"

envFrom:
- secretRef:
    name: searxng-secrets

volumes:
- name: config
  mountPath: /etc/searxng
  hostPath: /tank/encrypted/docker/the-pit-zfs/searxng/searxng
- name: redis-data
  hostPath: /tank/encrypted/docker/the-pit-zfs/searxng/redis

sidecars:
- name: redis
  image: docker.io/valkey/valkey:8-alpine
  command: [ "valkey-server", "--save", "30", "1", "--loglevel", "warning" ]
  volumeMounts:
  - name: redis-data
    mountPath: /data
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"

ingress:
  host: searxng.paynepride.com
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-ip-whitelist@kubernetescrd

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"

sealedSecret:
  enabled: true
  name: searxng-secrets
