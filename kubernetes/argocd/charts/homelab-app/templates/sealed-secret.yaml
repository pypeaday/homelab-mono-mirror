{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name | default (printf "%s-secrets" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData: {}
  template:
    metadata:
      name: {{ .Values.sealedSecret.name | default (printf "%s-secrets" .Release.Name) }}
      namespace: {{ .Release.Namespace }}
{{- end }}
