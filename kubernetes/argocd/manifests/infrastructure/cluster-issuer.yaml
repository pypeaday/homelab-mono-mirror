apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Replace with your email
    email: admin@paynepride.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # Use DNS-01 for wildcard certs (requires a DNS provider secret)
      # Adjust this to your DNS provider (cloudflare, route53, etc.)
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - "paynepride.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paynepride-wildcard
  namespace: homelab
spec:
  secretName: paynepride-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "paynepride.com"
    - "*.paynepride.com"
