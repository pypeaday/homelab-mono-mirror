name: "Docker Build and Push"
description: "Builds and pushes a Docker image to the Forgejo container registry"
inputs:
  forgejo_url:
    description: "Forgejo container registry URL (e.g. git.example.com)"
    default: "git.paynepride.com"
  forgejo_token:
    description: "Forgejo PAT with write:package (pass secrets.FORGEJO_TOKEN)"
    required: true
  extra_tags:
    description: "Comma-separated list of additional tags to apply and push (e.g. 'dev,staging,1.0.3')"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check for Dockerfile
      id: check
      shell: bash
      run: |
        if [ ! -f Dockerfile ]; then
          echo "No Dockerfile found. Skipping build."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Log in to Forgejo registry
      if: steps.check.outputs.found == 'true'
      shell: bash
      run: |
        echo "${{ inputs.forgejo_token }}" | docker login "${{ inputs.forgejo_url }}" -u "${{ github.actor }}" --password-stdin

    - name: Build and push image
      if: steps.check.outputs.found == 'true'
      shell: bash
      run: |
        retry_push() {
          local image=$1
          local max_retries=5
          local attempt=1
          while [ $attempt -le $max_retries ]; do
            if docker push "$image"; then
              return 0
            fi
            echo "Push failed, attempt $attempt/$max_retries. Retrying..."
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "Push failed after $max_retries attempts"
          return 1
        }

        REPO_NAME_RAW=$(basename "$GITHUB_REPOSITORY")
        # lowercase
        REPO_NAME=${REPO_NAME_RAW,,}
        BASE="${{ inputs.forgejo_url }}/${{ github.repository_owner }}/${REPO_NAME}"

        TAG_LATEST="${BASE}:latest"
        TAG_SHA="${BASE}:${GITHUB_SHA}"

        echo "Building and pushing ${TAG_SHA}"
        docker build -t "$TAG_SHA" -t "$TAG_LATEST" .

        retry_push "$TAG_SHA"
        retry_push "$TAG_LATEST"

        if [ -n "${{ inputs.extra_tags }}" ]; then
          IFS=',' read -ra TAGS <<< "${{ inputs.extra_tags }}"
          for tag in "${TAGS[@]}"; do
            TRIMMED_TAG=$(echo "$tag" | xargs)
            FULL_TAG="${BASE}:${TRIMMED_TAG}"
            echo "Tagging and pushing ${FULL_TAG}"
            docker tag "$TAG_SHA" "$FULL_TAG"
            retry_push "$FULL_TAG"
          done
        fi
